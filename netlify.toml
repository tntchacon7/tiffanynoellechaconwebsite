# [R6 ADDITION] Deployment configuration for Netlify — see
# R6-Launch-Readiness-Report.md ("Deployment Recommendation") for why Netlify
# is recommended: free static hosting with generous limits, one-click GitHub
# auto-deploy (push to main → live), free automatic SSL on a custom domain,
# and redirect rules live in this same repo (no separate dashboard config to
# keep in sync). No credentials or secrets live in this file — connecting the
# GitHub repo and pointing the domain both happen in Tyler's own Netlify
# account, which this file can't do on its own (see the report for the exact
# steps).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 4.16 requires Node 18.17+/20.3+/22+ — pinning 22 (LTS at time of
  # writing, and the version this project was built/tested against) avoids
  # Netlify silently picking a different default later.
  NODE_VERSION = "22"

# -----------------------------------------------------------------------------
